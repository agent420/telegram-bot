<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWA Debugger</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-family: sans-serif; text-align: center; padding: 20px; }
        .log-container { background: #000; color: #0f0; text-align: left; padding: 10px; font-family: monospace; font-size: 11px; border-radius: 5px; height: 150px; overflow-y: auto; margin: 20px 0; }
        .btn { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .status-dot { height: 10px; width: 10px; background-color: gray; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .active { background-color: lime; }
    </style>
</head>
<body>
    <h2>Diagnostic Système 🛠️</h2>
    
    <div style="text-align: left; display: inline-block;">
        <div><span id="dot1" class="status-dot"></span> Telegram JS chargé</div>
        <div><span id="dot2" class="status-dot"></span> initData récupérée</div>
        <div><span id="dot3" class="status-dot"></span> Appel API /api/me</div>
        <div><span id="dot4" class="status-dot"></span> Réponse reçue</div>
    </div>

    <div id="log" class="log-container">Démarrage du diagnostic...<br></div>
    <div id="app"></div>

    <script>
        const tg = window.Telegram.WebApp;
        const logDiv = document.getElementById('log');

        function addLog(msg, isError = false) {
            const color = isError ? 'red' : '#0f0';
            logDiv.innerHTML += <div style="color:${color}">> ${msg}</div>;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        async function init() {
            try {
                // ÉTAPE 1
                addLog("Vérification du SDK Telegram...");
                if (!tg) throw new Error("SDK Telegram introuvable");
                document.getElementById('dot1').classList.add('active');
                tg.ready();
                tg.expand();

                // ÉTAPE 2
                addLog("Récupération de initData...");
                if (!tg.initData || tg.initData.length < 10) {
                    throw new Error("initData vide ou invalide. Lancer via le bot !");
                }
                document.getElementById('dot2').classList.add('active');

                // ÉTAPE 3
                addLog("Appel au serveur : /api/me...");
                document.getElementById('dot3').classList.add('active');
                
                const response = await fetch('/api/me', {
                    headers: { 'x-tg-data': tg.initData }
                }).catch(err => { throw new Error("Erreur réseau: " + err.message); });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(Serveur erreur ${response.status}: ${errText});
                }

                // ÉTAPE 4
                const user = await response.json();
                document.getElementById('dot4').classList.add('active');
                addLog("Connexion réussie ! Utilisateur : " + (user.username || user.telegramId));

                // Lancement du jeu
                document.getElementById('app').innerHTML = `
                    <div style="margin-top:20px; padding:20px; background:var(--tg-theme-secondary-bg-color); border-radius:15px;">
                        <h3>Bienvenue, Héros !</h3>
                        <p>Classe : ${user.characterClass || 'Aucune'}</p>
                        <button class="btn" onclick="alert('L\'API fonctionne !')">Tester l'API</button>
                    </div>
                `;

            } catch (e) {
                addLog("ERREUR FATALE : " + e.message, true);
                document.getElementById('app').innerHTML = <div style="color:red; margin-top:20px;">L'application a planté. Regardez le log ci-dessus.</div>;
            }
        }

        setTimeout(init, 500);
    </script>
</body>
</html>
